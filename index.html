<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>در حال اتصال به منو...</title>
<link rel="preconnect" href="https://menu4.servervnp23.workers.dev" crossorigin>
<link rel="preconnect" href="https://menuc1.ir" crossorigin>
<link rel="preconnect" href="https://www.menuc1.ir" crossorigin>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; min-height:100dvh; display:flex; justify-content:center; align-items:center;
         background:#1a0f0a; color:#fff; font-family:Tahoma,Vazirmatn,sans-serif; text-align:center; padding:20px; }
  .container { width:100%; max-width:380px; }
  .sp { width:40px; height:40px; margin:0 auto 16px; border:4px solid rgba(255,255,255,.15); border-top-color:#fe7b01; border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #m { font-size:15px; line-height:1.7; margin-bottom:18px; color:#e0e0e0; }
  .links-box { display:flex; flex-direction:column; gap:12px; }
  .btn-link { display:flex; align-items:center; justify-content:space-between; background:#2a1a12; border:1px solid #fe7b01; color:#ffd9b4;
              padding:14px 18px; border-radius:10px; text-decoration:none; font-size:15px; font-weight:bold; }
  .btn-link:active { background:#fe7b01; color:#fff; }
  .badge { font-size:12px; padding:4px 8px; border-radius:6px; background:rgba(254,123,1,.2); color:#fe7b01; direction:ltr; }
</style>
</head>
<body>
<div class="container">
  <div class="sp" id="sp"></div>
  <p id="m">در حال شناسایی سریع‌ترین مسیر منو...</p>
  <div id="l" class="links-box"></div>
</div>

<script>
// همهٔ آدرس‌ها باید با https:// شروع شوند. اگر # داشته باشند، بعد از ورود همان بخش باز می‌شود.
var SITES = [
  { name: "همراه اول",      url: "https://menu4.servervnp23.workers.dev/" },
  { name: "همراه اول (۲)",  url: "https://www.menuc1.ir/" },
  { name: "ایرانسل",        url: "https://menuc1.ir/#menu" }
];

var TIMEOUT    = 6000;               // حداکثر انتظار برای هر مسیر
var SHOW_AFTER = 2500;               // بعد از این زمان دکمه‌های دستی هم نشان داده می‌شود
var FAST       = 2500;               // انتظار برای مسیر ذخیره‌شده (بازدید دوباره)
var KEEP       = 6 * 3600 * 1000;    // مسیر خوب تا ۶ ساعت یادآوری می‌شود

var done = false, shown = false, left = SITES.length;
var res = [], tags = [];

function baseOf(u) { return u.split('#')[0].replace(/\/+$/, ""); }
function getFinalUrl(u) {
  var s = location.search, h = location.hash;
  if (u.indexOf('#') !== -1) { var p = u.split('#'); return p[0] + s + (h || '#' + p[1]); }
  return u + s + h;
}
function save(i) { try { localStorage.setItem("gw", i + "|" + Date.now()); } catch (e) {} }
function saved() {
  try {
    var v = (localStorage.getItem("gw") || "").split("|");
    return v.length === 2 && Date.now() - Number(v[1]) < KEEP && SITES[Number(v[0])] ? Number(v[0]) : -1;
  } catch (e) { return -1; }
}
function setBadge(i, txt) { res[i] = txt; if (tags[i]) tags[i].textContent = txt; }

function ping(i, ms) {
  return new Promise(function (ok, no) {
    var c = new AbortController(), st = Date.now();
    var t = setTimeout(function () { c.abort(); }, ms);
    fetch(baseOf(SITES[i].url) + "/ping?_t=" + Date.now(), { mode: "no-cors", cache: "no-store", signal: c.signal })
      .then(function () { clearTimeout(t); setBadge(i, "✓ " + (Date.now() - st) + "ms"); ok(i); })
      .catch(function () { clearTimeout(t); setBadge(i, "✗"); no(i); });
  });
}
function go(i) {
  if (done) return;
  done = true;
  save(i);
  location.replace(getFinalUrl(SITES[i].url));
}
function showButtons(allFailed) {
  if (done) return;
  if (allFailed) {
    document.getElementById("sp").style.display = "none";
    document.getElementById("m").textContent = "اتصال خودکار برقرار نشد. لطفاً مسیر مربوط به اپراتور خود را انتخاب کنید:";
  } else if (!shown) {
    document.getElementById("m").textContent = "در حال شناسایی مسیر... اگر طول کشید، خودت یکی را انتخاب کن:";
  }
  if (shown) return;
  shown = true;
  var box = document.getElementById("l");
  SITES.forEach(function (site, i) {
    var a = document.createElement("a");
    a.className = "btn-link";
    a.href = getFinalUrl(site.url);
    var t = document.createElement("span");
    t.textContent = "ورود مخصوص " + site.name;
    var b = document.createElement("span");
    b.className = "badge";
    b.textContent = res[i] || "…";
    tags[i] = b;
    a.appendChild(t);
    a.appendChild(b);
    box.appendChild(a);
  });
}
function race() {
  SITES.forEach(function (s, i) {
    ping(i, TIMEOUT).then(go).catch(function () {
      left--;
      if (left === 0 && !done) showButtons(true);
    });
  });
}

setTimeout(function () { showButtons(false); }, SHOW_AFTER);
var s = saved();
if (s >= 0) ping(s, FAST).then(go).catch(race);
else race();
</script>
</body>
</html>
